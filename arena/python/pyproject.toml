[project]
name = "policy-arena"
version = "0.1.0"
description = "Python client for a Policy Arena deployment: submit evaluation sessions, register datasets, query the leaderboard"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "convex>=0.7.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_arena*"]
