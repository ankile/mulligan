# Square-Broad R1 collection starts: three arms, 100 starts each.
# Mulligan arm: the selected failure-promotion and top-length search: no perturbations, beta 1.0,
# candidate pool seed 202605310 + 2 + 1000 + 10000.
# Paper: Alg. 2, App. F.4, F.5 and F.7. Builds the locked R1 collection starts (`locked`) of
# mulligan/sim-square-broad-c01-dagger-mixed.
# Run: python -m mulligan.sampling.sim_design --config configs/sim/square_broad/r01_sampler.yaml --out <dir> --check
task: square_broad
round: 1
budget: 100

arms:
  # The baseline arm reused the first 100 starts of the R1 baseline-policy rollouts.
  baseline_uniform:
    policy_source: baseline_policy
    starts:
      file:
        path: data/sim/start_manifests/square_broad/r01/rollout_inputs/square_broad_baseline_uniform_r1_policy_rollout.json

  sobol:
    policy_source: mulligan_policy
    starts:
      promote_then_sobol:
        # R0 Sobol policy on accepted Sobol indices 200-299 (first 100 records).
        diagnostics:
          path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_sobol_r1_diagnostic_rollouts_audit.json
          limit: 100
        sobol_start: 300

  # Mulligan arm.
  mulligan:
    policy_source: mulligan_policy
    starts:
      select_initial_states:
        diagnostics:
          path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_sobol_r1_diagnostic_rollouts_audit.json
          limit: 100
        prior:
          - data/sim/start_manifests/square_broad/r00/init_states/square_broad_sobol_r0.json
        candidates: {n: 9000, seed: 202616312}
        distance: euclidean
        # The Square-Broad builders measured the distance to the prior and promoted
        # starts with a KD-tree over unit coordinates (no yaw wrap-around); the greedy
        # updates wrap yaw.
        prior_distance_periodic: false
        eval_grid_feedback: false
        hardness:
          - beta: 1.0
            normalize: minmax
            signal:
              length_model:
                max_steps: 400
                records:
                  - path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_sobol_r1_diagnostic_rollouts_audit.json
                    limit: 100

manifest:
  shuffle_seed: 2026052701
  match_tolerance: 1.0e-3
  disjoint_tolerance: 1.0e-6
  disjoint_from:
    - data/sim/start_manifests/square_broad/r00/init_states/square_broad_baseline_uniform_r0.json
    - data/sim/start_manifests/square_broad/r00/init_states/square_broad_sobol_r0.json
  # Headline grid: 30,000 valid Sobol points (manifest_hash e0b50566...).
  eval_grid:
    generator: valid_sobol
    num_points: 30000
    seed: 2026052499
    candidate_power: 16
    states_sha256: 8d455233a0412a8c8eaf72817b92fbb284edf6d541bf685ccd048f065ecd19f5

guardrail:
  arm: mulligan
  prior:
    - data/sim/start_manifests/square_broad/r00/init_states/square_broad_sobol_r0.json
  sobol_start: 300
  test_points: {n: 12000, seed: 2026052607}
  slack: 1.0
  enforce: true

locked:
  manifest:
    path: data/sim/start_manifests/square_broad/r01/blind_inputs/square_broad_r1_manifest.json
    sha256: 204a6b871ae4a0d9d9995c8f61e4ce4a41694e2769bf3ec24f6d0091e10d6355
  arms:
    baseline_uniform:
      path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_baseline_uniform_r1.json
      sha256: 2c24475eebef75fd84835acdb273fa57409dd1f2a7eb220fb9600dca78a0cd2d
    sobol:
      path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_sobol_r1.json
      sha256: fb9c8a1ebcb8e948293c1908bbb792e37d3d3b7c36b7439652fa2928a5a5bc6e
    mulligan:
      path: data/sim/start_manifests/square_broad/r01/init_states/square_broad_mulligan_r1.json
      sha256: a59e75f77984ce3f5542e3b3dacbb45a48284bb7d3d83170ddd0767ab59729e3
