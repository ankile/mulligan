# Thread Nut (square_d2) R5 start design (Alg. 2; mulligan.sampling.real_design). Promotes every R4 start the
# deployed DP+IQL or its with-CF DP proposal failed (21 < cap), grasp-phase breakdowns first.
# Coverage fill: yaw-led nut-pose hardness (beta 0.5), peg axes at 0.3. The manifest leads
# with the starts DP+IQL failed; starts only the proposal failed trail in a peg-and-class
# even-spread tail with the fills.
# Paper: Alg. 2, App. F.4 and F.6. Builds the locked R5 collection manifest (`locked`), the starts
# of mulligan/real-square-d2-c05-dagger-mixed. `inputs` are relative to --inputs-root (the repository root
# for the shipped manifests, `data/real/manifests/...`); the outcome and label tables are not
# released (configs/real/README.md).
# Run: python -m mulligan.sampling.real_design --config configs/real/square_d2/r05_sampler.yaml --inputs-root . --input eval_outcomes=<csv> --input stage_labels=<csv> --out <file>
task: square_d2
round: 5
budget: 50
source_eval_seed: 2026070304
baseline_seed: 2026070602
promotion:
  pool: any_fail
  arms: {iql: iql_cfinal, mulligan_with_cf: dp}
  stage_column: final_stage
  upstream_max_stage: 2
  rank_keys: [phase, num_steps, tiebreak]
  tiebreak: manifest_idx
  cap: 25
fill:
  seed: 2026070601
  pool_size: 32768
  beta: 0.5
  placement_weight: 0.3
  hardness: nut_pose
  hardness_params:
    weights: {yaw: 0.5, y_edge: 0.3, x_edge: 0.2}
    g_weight: 0.4
order:
  strategy: peg_path
  seed: 2026070605
  split_by_phase: true
  lead_if_failed: iql
  segment_names: {lead: true_composite_failure, demoted: already_solved_promotion}
inputs:
  eval_outcomes: <local-path>/paired_round_outcomes.csv
  stage_labels: <local-path>/stage_labels.csv
  support_manifests:
    - data/real/manifests/square_d2/r00/square_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/square_d2/r01/square_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r02/square_d2_r2_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r03/square_d2_r3_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r04/square_d2_r4_promote25_fill25_blind_dagger.json
  avoid_manifests:
    - data/real/manifests/square_d2/r00/square_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/square_d2/r01/square_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r01/square_d2_r1_eval_heldout_independent_sobol.json
    - data/real/manifests/square_d2/r02/square_d2_r2_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r02/square_d2_r2_eval_heldout_independent_sobol.json
    - data/real/manifests/square_d2/r03/square_d2_r3_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r03/square_d2_r3_eval_heldout_independent_sobol.json
    - data/real/manifests/square_d2/final/square_d2_final_dp_vs_iql_heldout_independent_sobol.json
    - data/real/manifests/square_d2/r04/square_d2_r4_promote25_fill25_blind_dagger.json
    - data/real/manifests/square_d2/r04/square_d2_r4_eval_heldout_independent_sobol.json

