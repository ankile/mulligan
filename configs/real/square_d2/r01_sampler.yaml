# Thread Nut (square_d2) R1 start design (Alg. 2; mulligan.sampling.real_design). Promotes the R0 Ours
# policy's held-out evaluation failures (upstream S0-S2 first, then earliest failure), fills
# with pure farthest-point coverage, and peg-batches the paired manifest.
# Paper: Alg. 2, App. F.4 and F.6. Builds the locked R1 collection manifest (`locked`), the starts
# of mulligan/real-square-d2-c01-dagger-mixed. `inputs` are relative to --inputs-root (the repository root
# for the shipped manifests, `data/real/manifests/...`); the outcome and label tables are not
# released (configs/real/README.md).
# Run: python -m mulligan.sampling.real_design --config configs/real/square_d2/r01_sampler.yaml --inputs-root . --input eval_outcomes=<csv> --input stage_labels=<csv> --out <file>
task: square_d2
round: 1
budget: 50
source_eval_seed: 2026062203
baseline_seed: 2026062402
promotion:
  pool: all_fail
  arms: {mulligan: mulligan_sobol}
  stage_column: max_stage
  failure_mode_column: failure_mode
  upstream_max_stage: 2
  rank_keys: [phase, num_steps, stage, tiebreak]
  tiebreak: stream_index
  cap: 25
fill:
  seed: 2026062401
  pool_size: 32768
  beta: 0.0
  placement_weight: 1.0
order:
  strategy: peg_path
  seed: 2026062476
  segment_names: {verbatim: verbatim_promotions}
inputs:
  eval_outcomes: <local-path>/paired_round_outcomes.csv
  stage_labels: <local-path>/labels_joined.csv
  support_manifests:
    - data/real/manifests/square_d2/r00/square_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
  avoid_manifests:
    - data/real/manifests/square_d2/r00/square_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json

# The locked manifest this config produced.
locked:
  manifest:
    path: data/real/manifests/square_d2/r01/square_d2_r1_promote25_fill25_blind_dagger.json
    sha256: 458ddb3321f546e0555b84f05c3ad2f79bf194c87c7d23297493e09abe4987e4
