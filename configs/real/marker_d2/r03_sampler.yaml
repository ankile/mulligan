# Insert Marker (marker_d2) R3 start design (Alg. 2; mulligan.sampling.real_design). Promotes the R2 with-CF DP's
# held-out evaluation failures; the coverage fill adds a small holder-depth hardness tilt
# (beta 0.05, smoothed per-depth failure rate of that policy) with holder axes at 0.7.
# Paper: Alg. 2, App. F.4 and F.6. Builds the locked R3 collection manifest (`locked`), the starts
# of mulligan/real-marker-d2-c03-dagger-mixed. `inputs` are relative to --inputs-root (the repository root
# for the shipped manifests, `data/real/manifests/...`); the outcome and label tables are not
# released (configs/real/README.md).
# Run: python -m mulligan.sampling.real_design --config configs/real/marker_d2/r03_sampler.yaml --inputs-root . --input eval_outcomes=<csv> --input stage_labels=<csv> --out <file>
task: marker_d2
round: 3
budget: 50
source_eval_seed: 2026062701
baseline_seed: 2026063030
promotion:
  pool: all_fail
  arms: {mulligan_with_cf: mulligan_with_cf}
  stage_column: max_stage_v2
  failure_mode_column: early_failure_mode_v2
  upstream_max_stage: 2
  rank_keys: [phase, num_steps, stage, tiebreak]
  tiebreak: stream_index
  cap: 25
fill:
  seed: 2026063007
  pool_size: 32768
  beta: 0.05
  placement_weight: 0.7
  hardness: holder_x_risk
  hardness_params: {success_columns: [mulligan_with_cf_success]}
order:
  strategy: holder_pairs
  seed: 2026063011
  segments: phase
  segment_names: {upstream: verbatim_upstream, later: verbatim_at_holder_plus_partial}
inputs:
  eval_outcomes: <local-path>/paired_round_outcomes.csv
  stage_labels: <local-path>/labels_joined.csv
  support_manifests:
    - data/real/manifests/marker_d2/r00/marker_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_promote25_fill25_blind_dagger.json
  avoid_manifests:
    - data/real/manifests/marker_d2/r00/marker_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_eval_heldout_independent_sobol.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_eval_heldout_independent_sobol.json

# The locked manifest this config produced.
locked:
  manifest:
    path: data/real/manifests/marker_d2/r03/marker_d2_r3_promote25_fill25_blind_dagger.json
    sha256: e6250c52a9b2b646276c1715fe59763f56ee28f32f0bbdc541819b43ddc127e4
