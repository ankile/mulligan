# Insert Marker (marker_d2) R5 start design (Alg. 2; mulligan.sampling.real_design), the logged exception to the
# earliest-breakdown order: four promotion tiers over the R4 with-CF DP (actor) and its
# DP+IQL rerank, capped by a 15-fill floor (cap 35; the DP failure pool itself held 20 <= 25).
# Coverage fill is pure coverage (beta 0) split evenly over holder depths 6/7/8 in.
# Paper: Alg. 2, App. F.4 and F.6. Builds the locked R5 collection manifest (`locked`), the starts
# of mulligan/real-marker-d2-c05-dagger-mixed. `inputs` are relative to --inputs-root (the repository root
# for the shipped manifests, `data/real/manifests/...`); the outcome and label tables are not
# released (configs/real/README.md).
# Run: python -m mulligan.sampling.real_design --config configs/real/marker_d2/r05_sampler.yaml --inputs-root . --input eval_outcomes=<csv> --input stage_labels=<csv> --out <file>
task: marker_d2
round: 5
budget: 50
source_eval_seed: 2026070604
baseline_seed: 2026070702
promotion:
  pool: tiered
  arms: {dp: dp, iql: iql_c100k}
  stage_column: max_stage_v2
  failure_mode_column: early_failure_mode_v2
  upstream_max_stage: 2
  rank_keys: [tier, num_steps, tiebreak]
  tiebreak: manifest_idx
  cap: 35
  tiers:
    actor_arm: dp
    reranked_arm: iql
    insert_stage: 3
    freeze_failure_mode: timeout_holding_marker
    pen_r_min_m: 0.12
    pen_y_abs_min_in: 3.0
    names:
      - freeze_at_hole_dp_insert_failure
      - iql_regression_dp_win_iql_fail
      - dp_insert_failure_nonfreeze
      - dp_grasp_failure_extreme_corner
fill:
  seed: 2026070701
  pool_size: 32768
  beta: 0.0
  placement_weight: 0.7
  bands: {mode: balanced, bands: [6, 7, 8]}
order:
  strategy: holder_pairs
  seed: 2026070707
  segments: tier
inputs:
  eval_outcomes: <local-path>/paired_round_outcomes.csv
  stage_labels: <local-path>/interim_backbone_labels_joined.csv
  support_manifests:
    - data/real/manifests/marker_d2/r00/marker_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r03/marker_d2_r3_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r04/marker_d2_r4_promote25_fill25_blind_dagger.json
  avoid_manifests:
    - data/real/manifests/marker_d2/r00/marker_d2_r0_three_arm_uniform100_sobol100_evalsobol50_scrambled.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r03/marker_d2_r3_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r04/marker_d2_r4_promote25_fill25_blind_dagger.json
    - data/real/manifests/marker_d2/r01/marker_d2_r1_eval_heldout_independent_sobol.json
    - data/real/manifests/marker_d2/r02/marker_d2_r2_eval_heldout_independent_sobol.json
    - data/real/manifests/marker_d2/final/marker_d2_final_dp_vs_iql_heldout_independent_sobol.json
    - data/real/manifests/marker_d2/r03/marker_d2_r3_eval_heldout_independent_sobol.json
    - data/real/manifests/marker_d2/r04/marker_d2_r4_eval_heldout_independent_sobol.json

# The locked manifest this config produced.
